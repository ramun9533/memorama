<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memorama: Mi Ciudad en el Tiempo</title>

<style>
@import url('https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  background: #222;
  color: #fff;
  text-align: center;
  padding: 20px;
}

h1 { margin-bottom: 5px; }
p { opacity: 0.85; }

/* INFO */
.info {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 10px;
  font-weight: 500;
}

/* CONTENEDOR */
.container {
  display: grid;
  grid-template-columns: repeat(3, 150px);
  gap: 12px;
  justify-content: center;
  margin: 30px auto;
}

/* RESPONSIVE */
@media (max-width: 600px) {
  .container {
    grid-template-columns: repeat(3, 100px);
  }
  .box {
    width: 100px;
    height: 100px;
  }
}

/* CARTA */
.box {
  position: relative;
  width: 150px;
  height: 150px;
  background: rgba(45,45,45,1);
  overflow: hidden;
  cursor: pointer;
}

/* EFECTO NEÓN */
.box::before {
  content: '';
  position: absolute;
  top: var(--y);
  left: var(--x);
  transform: translate(-50%, -50%);
  width: 300px;
  height: 300px;
  background: radial-gradient(var(--clr), transparent, transparent);
  transition: 0.1s;
}

.box::after {
  content: '';
  position: absolute;
  inset: 2px;
  background: rgba(45,45,45,0.95);
  z-index: 1;
}

/* FLIP */
.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.6s;
  z-index: 2;
}

.box.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front,
.card-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 6px;
}

.card-front {
  font-size: 2em;
  font-weight: bold;
  background: #555;
}

.card-back {
  transform: rotateY(180deg);
}

.card-back img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* MENSAJE */
#message {
  margin-top: 15px;
  font-size: 1.2em;
  color: #0f0;
}
</style>
</head>

<body>

<h1> Memorama: Mi Ciudad en el Tiempo</h1>
<p>Encuentra las parejas: <span style="color:#3498db">ANTES</span> y <span style="color:#2ecc71">AHORA</span></p>

<div class="info">
  <div>⏱ Tiempo: <span id="time">0</span>s</div>
  <div>🔁 Intentos: <span id="moves">0</span></div>
</div>

<div class="container" id="game"></div>
<div id="message"></div>

<!-- SONIDOS -->
<audio id="flipSound" src="sounds/flip.mp3"></audio>
<audio id="matchSound" src="sounds/match.mp3"></audio>

<script>
/* === DATOS === */
const pares = [
  { antes: 'lugar1_antes.jpg', despues: 'lugar1_despues.jpg' },
  { antes: 'lugar2_antes.jpg', despues: 'lugar2_despues.jpg' },
  { antes: 'lugar3_antes.jpg', despues: 'lugar3_despues.jpg' },
  { antes: 'lugar4_antes.jpg', despues: 'lugar4_despues.jpg' },
  { antes: 'lugar5_antes.jpg', despues: 'lugar5_despues.jpg' },
  { antes: 'lugar6_antes.jpg', despues: 'lugar6_despues.jpg' }
];

let cartas = [];
pares.forEach((par, id) => {
  cartas.push({ img: par.antes, id, tipo: 'antes' });
  cartas.push({ img: par.despues, id, tipo: 'despues' });
});

cartas.sort(() => Math.random() - 0.5);

const game = document.getElementById('game');
const movesEl = document.getElementById('moves');
const timeEl = document.getElementById('time');
const messageEl = document.getElementById('message');

const flipSound = document.getElementById('flipSound');
const matchSound = document.getElementById('matchSound');

let seleccionadas = [];
let bloquear = false;
let aciertos = 0;
let intentos = 0;
let tiempo = 0;
let timer;

/* === TIMER === */
timer = setInterval(() => {
  tiempo++;
  timeEl.textContent = tiempo;
}, 1000);

/* === CREAR CARTAS === */
cartas.forEach(carta => {
  const box = document.createElement('div');
  box.className = 'box';

  // Color según tipo
  const color = carta.tipo === 'antes' ? '#3498db' : '#2ecc71';
  box.style.setProperty('--clr', color);

  box.innerHTML = `
    <div class="card-inner">
      <div class="card-front">?</div>
      <div class="card-back">
        <img src="${carta.img}">
      </div>
    </div>
  `;

  box.addEventListener('click', () => voltear(box, carta));
  game.appendChild(box);
});

/* === LÓGICA === */
function voltear(box, carta) {
  if (bloquear || box.classList.contains('flipped')) return;

  flipSound.currentTime = 0;
  flipSound.play();

  box.classList.add('flipped');

  if (seleccionadas.length === 0) {
    seleccionadas.push({ box, carta });
  } else {
    bloquear = true;
    intentos++;
    movesEl.textContent = intentos;

    const primera = seleccionadas[0];

    if (primera.carta.id === carta.id) {
      matchSound.play();
      aciertos++;
      seleccionadas = [];
      bloquear = false;

      if (aciertos === pares.length) {
        clearInterval(timer);
        messageEl.textContent =
          `🎉 ¡Ganaste en ${tiempo}s con ${intentos} intentos!`;
      }
    } else {
      setTimeout(() => {
        primera.box.classList.remove('flipped');
        box.classList.remove('flipped');
        seleccionadas = [];
        bloquear = false;
      }, 900);
    }
  }
}

/* === EFECTO LUZ === */
document.addEventListener('mousemove', e => {
  document.querySelectorAll('.box').forEach(box => {
    const rect = box.getBoundingClientRect();
    box.style.setProperty('--x', `${e.clientX - rect.left}px`);
    box.style.setProperty('--y', `${e.clientY - rect.top}px`);
  });
});
</script>

</body>
</html>
